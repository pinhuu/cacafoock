<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel = "stylesheet" href = "/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>

    <div class = "log-container">
        <form class = "log-form" id = "logform">
            <h2>Login</h2>
            <div class = "form-group">
                <label for = "username">Username:</label>
                <input type = "text" id = "username" name = "username" required>
            </div>
            <div class = "form-group">
                <label for = "password">Password:</label>
                <input type = "password" id = "password" name = "password" required>
            </div>
            <button onlick = "location.href = '/main/index.html'" type = "submit" class = "btn-submit">Login</button>
            <button onclick = "location.href = '/register/index.html'" type = "register" class = "btn-register">Register</button>
            <a href = "" class = "forgot-password">Forgot Password?</a>
        </form>
    </div>
    
</body>
</html>
